<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberstrike</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="items">
                <span class="badge badge-top">⚡Temporada 04 ativa</span>

                <div class="tags">
                    <span class="badge">🛡️ Anti-Cheat</span>
                    <span class="badge">⚡ 128 Tick</span>
                    <span class="badge">🏆 Ranqueado</span>
                </div>
                <button class="btn">Jogar Agora ⚔️</button>
            </div>
            <img src="assets/cyberstrike-art.png" alt="cyberstrike logo" class="image-logo">
        </div>
    </main>

</html>
